<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <div>
                    <p class="brand-kicker">Workspace</p>
                    <h1>Planificador de Tareas</h1>
                </div>
            </div>
            <div class="topbar-meta">
                <span class="meta-chip" id="taskCount">0 tareas</span>
                <span class="meta-chip meta-chip-live">API conectada</span>
            </div>
        </header>

        <main class="workspace">
            <section class="panel composer">
                <div class="panel-head">
                    <h2>Nueva tarea</h2>
                    <p>Captura lo esencial. El resto se organiza solo.</p>
                </div>

                <form id="taskForm" action="#" method="post">
                    <div class="field">
                        <label for="newTaskNameInput" class="form-label">Nombre</label>
                        <input
                            type="text"
                            class="form-control"
                            id="newTaskNameInput"
                            name="nombre"
                            placeholder="Ej: Estudiar JavaScript"
                            autocomplete="off"
                        >
                    </div>

                    <div class="field">
                        <label for="newTaskDescriptionInput" class="form-label">Descripción</label>
                        <textarea
                            class="form-control"
                            id="newTaskDescriptionInput"
                            name="descripcion"
                            rows="4"
                            placeholder="Describe brevemente la tarea..."
                        ></textarea>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="newTaskDateInput" class="form-label">Fecha de entrega</label>
                            <input
                                type="date"
                                class="form-control"
                                id="newTaskDateInput"
                                name="fecha"
                            >
                        </div>
                        <div class="field">
                            <label for="newTaskStatusInput" class="form-label">Estado</label>
                            <select class="form-select" id="newTaskStatusInput" name="estado">
                                <option value="" selected>Selecciona un estado</option>
                                <option value="PENDING">Pendiente</option>
                                <option value="IN_PROGRESS">En progreso</option>
                                <option value="DONE">Hecho</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary submit-btn">
                        Agregar tarea
                    </button>
                </form>
            </section>

            <section class="panel inbox">
                <div class="panel-head">
                    <h2>Lista de tareas</h2>
                    <p>Marca, actualiza o elimina sin perder el contexto.</p>
                </div>
                <div id="taskList" class="task-feed"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
