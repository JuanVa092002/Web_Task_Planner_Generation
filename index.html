<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <div class="container py-4">

        <!-- Header -->
        <header class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <h1 class="card-title h3 mb-0 fw-bold">Planificador de Tareas</h1>
            </div>
        </header>

        <!-- Contenido principal: formulario + lista -->
        <main class="row g-4 align-items-start">

            <!-- Formulario -->
            <section class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title h5 mb-4">Formulario</h2>

                        <form id="taskForm" action="#" method="post">
                            <div class="mb-3">
                                <label for="newTaskNameInput" class="form-label">Nombre</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="newTaskNameInput"
                                    name="nombre"
                                    placeholder="Ej: Estudiar JavaScript"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="newTaskDescriptionInput" class="form-label">Descripción</label>
                                <textarea
                                    class="form-control"
                                    id="newTaskDescriptionInput"
                                    name="descripcion"
                                    rows="3"
                                    placeholder="Describe brevemente la tarea..."
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="newTaskDateInput" class="form-label">Fecha de entrega</label>
                                <input
                                    type="date"
                                    class="form-control w-50"
                                    id="newTaskDateInput"
                                    name="fecha"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="newTaskStatusInput" class="form-label">Estado</label>
                                <select class="form-select" id="newTaskStatusInput" name="estado">
                                    <option value="" selected>Selecciona un estado</option>
                                    <option value="Por hacer">Por hacer</option>
                                    <option value="En proceso">En proceso</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Finalizado">Finalizado</option>
                                    <option value="Atrasada">Atrasada</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                + Agregar tarea
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Lista de tareas -->
            <section class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h2 class="h5 mb-4">Lista de tareas</h2>
                        <div id="taskList" class="row row-cols-1 g-3"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
